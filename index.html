  <style id="v9-style">
    :root { --beat-sec: 0.545s; --half-beat-sec: 0.272s; }
    .beat-puppet-stage { position: relative; width: 100%; height: 100%; overflow: visible; user-select: none; pointer-events: none; }
    .puppet-layer { position: absolute; inset: 0; width: 100%; height: 100%; }
    .puppet-layer svg, .puppet-layer img { width: 100%; height: 100%; display: block; }
    @keyframes puppetTorsoBounce { 0%, 100% { transform: translateY(0) scaleY(1); } 36% { transform: translateY(3.5px) scaleY(0.988); } 68% { transform: translateY(-1px) scaleY(1.005); } }
    @keyframes puppetHeadNod { 0%, 100% { transform: translateY(0) rotate(-2.4deg); } 38% { transform: translateY(4.5px) rotate(4.8deg); } 72% { transform: translateY(-1.5px) rotate(-1.2deg); } }
    @keyframes puppetMicSwing { 0%, 100% { transform: translate(0,0) rotate(-5deg) scale(1); } 40% { transform: translate(-3px,-7px) rotate(8.5deg) scale(1.04); } 75% { transform: translate(2px,2px) rotate(-2deg) scale(0.99); } }
    @keyframes flamePulse { 0%, 100% { transform: scaleX(1) scaleY(1) translateY(0); opacity: 0.86; } 50% { transform: scaleX(1.06) scaleY(1.15) translateY(-5px); opacity: 1; } }
    @keyframes emberRise { 0% { transform: translateY(14px) translateX(0) scale(1); opacity: 0.95; } 100% { transform: translateY(-115px) translateX(var(--ex, 10px)) scale(0.2); opacity: 0; } }
    @keyframes hitStopFlash { 0% { opacity: 0.92; background: linear-gradient(135deg, #fff, #00f0ff); } 100% { opacity: 0; background: transparent; } }
    .puppet-torso-anim { transform-origin: 50% 96%; animation: puppetTorsoBounce var(--beat-sec) cubic-bezier(.28,.08,.32,1) infinite; }
    .puppet-head-anim { transform-origin: 50% 44%; animation: puppetHeadNod var(--beat-sec) cubic-bezier(.26,.06,.3,1) infinite; }
    .puppet-hand-anim { transform-origin: 72% 92%; animation: puppetMicSwing var(--beat-sec) ease-in-out infinite; z-index: 6; }
    .puppet-spit-burst .puppet-hand-anim { transform: translate(-6px, -12px) scale(1.18) rotate(12deg) !important; transition: transform 0.14s ease-out; }
    .puppet-flame-wrap { position: absolute; inset: -8% -10% 0% -10%; z-index: 1; mix-blend-mode: screen; pointer-events: none; transform-origin: 50% 92%; animation: flamePulse var(--half-beat-sec) ease-in-out infinite; }
    .puppet-flame-wrap.inferno { inset: -16% -16% 0% -16%; filter: saturate(1.35) brightness(1.2); }
    .flame-ember { position: absolute; bottom: 12%; width: 5px; height: 5px; border-radius: 50%; mix-blend-mode: screen; animation: emberRise 1.1s linear infinite; }

    .heat-bar-mini { width: 46px; height: 6px; background: #1b1524; border-radius: 99px; overflow: hidden; }
    .heat-bar-fill { height: 100%; background: linear-gradient(90deg, #ffc83b, #ff2e93, #ff3358); transition: width 0.18s ease; }
    .heat-danger { box-shadow: 0 0 14px rgba(255,51,88,0.8); border-color: #ff3358; }
    .stick-deck-grid { display: grid; grid-template-columns: 114px 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
    .v-joystick-zone { position: relative; width: 104px; height: 104px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle, rgba(0,240,255,0.14) 0%, rgba(12,13,24,0.94) 72%); border: 1.8px solid rgba(0,240,255,0.48); box-shadow: inset 0 0 18px rgba(0,240,255,0.18), 0 4px 16px rgba(0,0,0,0.65); touch-action: none; user-select: none; cursor: grab; }
    .v-joystick-knob { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0%, #00f0ff 45%, #0a2540 100%); border: 2px solid #fff; box-shadow: 0 0 16px rgba(0,240,255,0.85); pointer-events: none; }
    .v-stick-hint { position: absolute; bottom: -14px; left: 0; right: 0; text-align: center; font-size: 8px; font-family: monospace; color: var(--text-sub); pointer-events: none; }
    .tactical-skill-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 6px; }
    .tac-skill-btn { padding: 6px 4px; border-radius: 8px; background: linear-gradient(180deg, #1e1e32, #11111d); border: 1px solid var(--border); color: var(--text-main); font-size: 9.5px; font-weight: 800; cursor: pointer; text-align: center; line-height: 1.2; }

AudioEngine.getCurrentBpm = function () {
  const tid = this.currentTrackId || (state.music && state.music.equippedTrackId) || 'bb_01';
  return Math.max(75, Math.min(168, (this.findTrack(tid)?.bpm) || 110));
};

function buildCyberFlameHTML(isBSide, lv) {
  if (!lv || lv <= 0) return '';
  const customFlame = AssetImageCache.resolve(isBSide ? 'fx_flame_pink.png' : 'fx_flame_cyan.png');

  return `<div class="puppet-flame-wrap ${lv >= 2 ? 'inferno' : ''}">
    ${customFlame ? `<img src="${customFlame}" alt="" style="position:absolute;inset:0;mix-blend-mode:screen;">` : ''}

      <ellipse cx="210" cy="340" rx="${lv>=2?168:132}" ry="${lv>=2?195:150}" fill="url(#fg_${uid})"/>
      <path d="M88 470 C62 360,108 250,134 158 C142 224,162 238,175 112 C196 196,212 184,224 72 C244 176,268 202,286 124 C296 218,326 244,336 172 C356 276,354 374,332 470 Z" fill="url(#fg_${uid})" opacity="${lv>=2?0.96:0.78}"/>
      <path d="M132 470 C118 372,152 288,178 204 C192 262,206 246,214 156 C230 242,248 258,264 198 C286 286,298 378,288 470 Z" fill="${c1}" opacity="${lv>=2?0.62:0.42}"/>
    </svg>${embers}</div>`;
}

function renderBeatPuppetHTML(profile, opts) {
  const o = opts || {}, p = profile || state.profile, sideObj = getSideTheme(p.side), isDiva = p.gender === 'diva';
  const glow = o.glow || getImplantGlow(), uid = 'pup' + (++_svgSeq % 9999), bpm = o.bpm || AudioEngine.getCurrentBpm();
  const skins = [{ base:'#ffede4', blush:'#ff9eb5', shd1:'#f0bfa8', shd2:'#bf7c63', line:'#45221d' },{ base:'#f8d3bc', blush:'#f48a9e', shd1:'#e0a585', shd2:'#aa6848', line:'#3e1e18' },{ base:'#e2a87f', blush:'#d96b78', shd1:'#c17f53', shd2:'#8a4e29', line:'#33170f' },{ base:'#b0724a', blush:'#a34852', shd1:'#8c512d', shd2:'#592d13', line:'#241008' }];
  const sk = skins[p.skinTone] || skins[0], out = findOutfitById(o.outfitId || p.outfitId || 'init_hoodie'), eqUps = o.upgrades || getEquippedUpgrades();
  const hairBase = p.hairColor || '#f1f5f9', hairDark = shadeHex(hairBase, -72), hairLight = shadeHex(hairBase, 52), meshCol = p.meshColor || sideObj.color, acc = p.accentColor || sideObj.color;
  const clothBase = out.color || '#2b2e42', defs = `<defs><linearGradient id="skin_${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${sk.base}"/><stop offset="100%" stop-color="${sk.shd1}"/></linearGradient><linearGradient id="hair_${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${hairLight}"/><stop offset="40%" stop-color="${hairBase}"/><stop offset="100%" stop-color="${hairDark}"/></linearGradient><linearGradient id="hairDarkG_${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${hairBase}"/><stop offset="100%" stop-color="${hairDark}"/></linearGradient><linearGradient id="cloth_${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${shadeHex(clothBase,38)}"/><stop offset="30%" stop-color="${clothBase}"/><stop offset="100%" stop-color="${shadeHex(clothBase,-46)}"/></linearGradient><linearGradient id="irisL_${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="55%" stop-color="${acc}"/><stop offset="100%" stop-color="#fff"/></linearGradient><linearGradient id="irisR_${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="55%" stop-color="#ffc83b"/><stop offset="100%" stop-color="#fff"/></linearGradient></defs>`;
  const headPng = AssetImageCache.resolve(`${isDiva?'diva':'king'}_head_${p.hairType||0}.png`), bodyPng = AssetImageCache.resolve(`${isDiva?'diva':'king'}_outfit_${out.id}.png`), handPng = AssetImageCache.resolve('hand_mic_foreground.png');
  const hairL = buildAnimeHairLayers(isDiva, p.hairType || 0, uid, meshCol), eyesSvg = buildAnimeEyesLayer(isDiva, p.eyesType || 0, uid, acc, meshCol, hairDark), outSvg = buildAnimeOutfitLayer(isDiva, out, uid, glow);
  const faceP = isDiva ? 'M152 122 C152 156,162 184,182 201 Q198 214,210 215 Q222 214,238 201 C258 184,268 156,268 122 C268 78,244 64,210 64 C176 64,152 78,152 122 Z' : 'M148 122 C148 158,158 186,178 204 Q196 218,210 219 Q224 218,242 204 C262 186,272 158,272 122 C272 76,246 62,210 62 C174 62,148 76,148 122 Z';
  const chainSvg = eqUps.includes('chain_silver') ? `<path d="M164 256 Q210 312 256 256" fill="none" stroke="#fff" stroke-width="7.5" stroke-dasharray="7 3" stroke-linecap="round"/>` : '';
  const torsoHTML = bodyPng ? `<div class="puppet-layer puppet-torso-anim"><img src="${bodyPng}" alt=""></div>` : `<div class="puppet-layer puppet-torso-anim"><svg viewBox="0 10 420 342">${defs}<path d="M180 198 L170 272 L250 272 L240 198 Z" fill="url(#skin_${uid})" stroke="${sk.line}" stroke-width="2"/>${outSvg}${chainSvg}</svg></div>`;
  const headHTML = headPng ? `<div class="puppet-layer puppet-head-anim"><img src="${headPng}" alt=""></div>` : `<div class="puppet-layer puppet-head-anim"><svg viewBox="0 10 420 342">${defs}<g>${hairL.back}</g><path d="${faceP}" fill="url(#skin_${uid})" stroke="${sk.line}" stroke-width="2.2"/><path d="M210 140 L206 164 L213 167" fill="none" stroke="${sk.shd2}" stroke-width="2"/><path d="M194 185 Q210 189 227 181" fill="none" stroke="${sk.line}" stroke-width="2.2"/>${eyesSvg}<g>${hairL.front}</g></svg></div>`;
  const handHTML = o.showMicHand === false ? '' : (handPng ? `<div class="puppet-layer puppet-hand-anim"><img src="${handPng}" alt=""></div>` : `<div class="puppet-layer puppet-hand-anim"><svg viewBox="0 10 420 342"><g transform="translate(18,8)"><rect x="252" y="226" width="22" height="96" rx="8" transform="rotate(-18 263 274)" fill="#0d0f1a" stroke="#cbd5e1" stroke-width="2"/><ellipse cx="246" cy="214" rx="19" ry="21" transform="rotate(-18 246 214)" fill="#1e293b" stroke="${glow}" stroke-width="2.4"/><path d="M244 252 C240 242,274 236,282 250 C288 262,284 286,268 292 C252 296,244 274,244 252 Z" fill="#111320" stroke="${glow}" stroke-width="2"/></g></svg></div>`);
  return `<div class="beat-puppet-stage ${o.burstClass||''}" style="--beat-sec:${(60/bpm).toFixed(3)}s;--half-beat-sec:${(30/bpm).toFixed(3)}s;${o.flipX?'transform:scaleX(-1);':''}">${buildCyberFlameHTML(p.side==='b_side', o.flameLevel||0)}${torsoHTML}${headHTML}${handHTML}</div>`;
}

const Street25DEngine = {
  renderer: null, scene: null, camera: null, rafId: null, running: false, builtZoneIdx: -1,
  rainGeo: null, playerSprite: null, rivalMeshes: [], joyVec: { x: 0, y: 0 }, keys: {}, posX: 0, posZ: 21, lastTs: 0,
  gridToWorld(gx, gy) { return { x: (gx - 3) * 2.5, z: (gy - 3) * 7.0 }; },
  worldToGrid(wx, wz) { return { gx: Math.max(0, Math.min(6, Math.round(wx / 2.5 + 3))), gy: Math.max(0, Math.min(6, Math.round(wz / 7.0 + 3))) }; },
  makeTex(t1, t2, hex, isMc) {
    const c = document.createElement('canvas'); c.width = isMc ? 160 : 256; c.height = isMc ? 220 : 96; const g = c.getContext('2d');
    if (isMc) { g.fillStyle = hex; g.beginPath(); g.arc(80, 62, 25, 0, 6.28); g.fill(); g.fillStyle = '#0d0e1a'; g.beginPath(); g.moveTo(38,212); g.quadraticCurveTo(80,92,122,212); g.closePath(); g.fill(); g.strokeStyle = hex; g.lineWidth = 4; g.stroke(); g.fillStyle = '#fff'; g.font = '900 16px monospace'; g.textAlign = 'center'; g.fillText(t1.slice(0,11), 80, 22); }
    else { g.fillStyle = '#070812'; g.fillRect(0,0,256,96); g.strokeStyle = hex; g.lineWidth = 6; g.strokeRect(4,4,248,88); g.fillStyle = hex; g.font = '900 25px Impact,sans-serif'; g.textAlign = 'center'; g.fillText(t1.slice(0,14), 128, 46); g.fillStyle = '#f8fafc'; g.font = '700 15px monospace'; g.fillText(t2.slice(0,18), 128, 74); }
    return new THREE.CanvasTexture(c);
  },
  buildZoneScene(zIdx) {
    if (typeof THREE === 'undefined') return false;
    if (!this.renderer) { this.renderer = new THREE.WebGLRenderer({ antialias: true }); this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); this.camera = new THREE.PerspectiveCamera(58, 1.6, 0.2, 95); }
    if (this.scene) this.scene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { (Array.isArray(o.material)?o.material:[o.material]).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); } });
    const zone = STREET_ZONES[zIdx] || STREET_ZONES[0], sc = new THREE.Scene();
    sc.background = new THREE.Color(zone.sky || '#090914'); sc.fog = new THREE.FogExp2(zone.sky || '#090914', 0.028);
    sc.add(new THREE.AmbientLight(0xffffff, 0.6));
    const lA = new THREE.PointLight(zone.neonA, 1.8, 36); lA.position.set(-5, 6, 4); sc.add(lA);
    const lB = new THREE.PointLight(zone.neonB, 1.8, 36); lB.position.set(5, 6, -12); sc.add(lB);
    const road = new THREE.Mesh(new THREE.PlaneGeometry(19, 58), new THREE.MeshStandardMaterial({ color: 0x090b14, roughness: 0.16, metalness: 0.78 })); road.rotation.x = -Math.PI / 2; sc.add(road);
    for (let i = -3; i <= 3; i++) {
      const pd = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 5.4), new THREE.MeshBasicMaterial({ color: i%2===0?zone.neonA:zone.neonB, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending }));
      pd.rotation.x = -Math.PI / 2; pd.position.set(i%2===0?-3.4:3.4, 0.02, i * 7.2); sc.add(pd);
    }
    for (let z = -24; z <= 24; z += 6) [-9.6, 9.6].forEach((xs, idx) => {

    <div class="panel" style="padding:7px 9px;"><div style="display:flex;gap:6px;"><input type="text" id="battle-free-input" placeholder="自由1行アンサー入力（母音一致で特大クリティカル）"><button class="btn btn-cyan" style="width:auto;padding:0 12px;" onclick="executeRhythmSpit('free')">自由SPIT</button></div></div>`
  );
  startBeatRingLoop();
};

function executeRhythmSpit(mode) {
  const b = activeBattle; if (!b) return;
  const dist = Math.min(getBeatPhase(), 1 - getBeatPhase()), winW = b.activeSkill === 'acapella' ? 0.32 : 0.18;
  const tRank = dist <= winW ? 'JUST' : dist <= 0.34 ? 'GOOD' : 'LATE', tMult = tRank === 'JUST' ? 1.5 : tRank === 'GOOD' ? 1.15 : 0.92;
  const st = state.stats || { lyric:10, flow:10, vibes:10 }, statBoost = Math.floor((st.lyric + st.flow + st.vibes)/8) + ((state.level||1)-1)*2;
  let base = 0, hit = false, line = '';
  if (mode === 'free') {
    const txt = (document.getElementById('battle-free-input')?.value || '').trim();
    if (txt.length < 5) return showToast('5文字以上のアンサーを入力してください！');
    if (LEGAL_NG_WORDS.some(w => txt.includes(w))) return showToast('⚠️ 審査NGワードが含まれています');
    const v = extractVowelsJP(txt); hit = v.slice(-2) === b.rival.targetVowel.slice(-2) || v.includes(b.rival.targetVowel);
    base = (hit ? 30 : 16) + statBoost; line = txt; state.lyrics.push({ id:'lyr_'+Date.now(), text:txt, vowels:v, rank:hit?'S':'A', moneySnap:state.cash });
  } else {
    const ch = b.choices[b.armedIdx || 0]; line = ch.text;
    if (ch.quality === 'perfect') { base = 24 + statBoost; hit = true; } else if (ch.quality === 'good') base = 13 + Math.floor(statBoost/2); else base = -10;
  }
  b.rhymeChain = hit ? b.rhymeChain + 1 : 0;
  const delta = base > 0 ? Math.round(base * tMult * (1 + Math.min(0.75, b.rhymeChain * 0.18)) * (b.nextSpitBoost || 1)) : base;
  const counter = b.round < b.maxRounds ? Math.round((b.rival.isBoss ? 12 : 7) * (b.activeSkill === 'acapella' ? 0.5 : 1)) : 0;
  b.hype = Math.max(5, Math.min(100, b.hype + delta - counter)); b.spitBurst = true; b.nextSpitBoost = 1;
  Object.keys(b.cooldowns).forEach(k => { if (b.cooldowns[k] > 0 && k !== b.activeSkill) b.cooldowns[k]--; }); b.activeSkill = null;
  b.lastLog = `${tRank}(${tMult}x) ${hit?`🔥x${b.rhymeChain}`:''} ➔ ${delta>=0?'+':''}${delta}%`;
  if (tRank === 'JUST' || hit) {
    const sh = document.getElementById('shutter'); if (sh) { sh.style.animation = 'none'; void sh.offsetWidth; sh.style.animation = 'hitStopFlash 0.22s ease-out forwards'; }
    triggerSlashCutIn(tRank==='JUST'?'JUST SPIT x1.5!!':'RHYME CHAIN!!', line.slice(0, 16), '#c8ff29');
  }
  if (b.hype >= 88 || b.round >= b.maxRounds) {
    const isWin = b.hype >= 52, r = b.rival; if (beatRingRaf) cancelAnimationFrame(beatRingRaf); activeBattle = null; AudioEngine.stop();
    if (isWin) {
      const v9 = ensureV9State(), zId = (STREET_ZONES[state.areaIndex]||STREET_ZONES[0]).id;
      v9.turf[zId] = Math.max(8, Math.min(92, (v9.turf[zId]??50) + (state.profile.side==='a_side'?6:-6)));
      const won = Math.floor(r.rewardCash * getActiveLabelBuff('hustle')); state.cash += won; state.respect += r.isBoss?42:16;
      if (r.isBoss) handleBossRootUnlock(r); if (r.isRare && r.dropRoot) handleRareRootDrop(r);
      gainExp(r.exp); updateHeader(); saveState(); renderStreetTab(); showToast(`🏆 勝利！ +¥${won.toLocaleString()} ＆ ${zId}支配率UP！`);
    } else { gainExp(18); updateHeader(); saveState(); renderStreetTab(); showToast('惜敗… リズムと韻を合わせて再挑戦しよう！'); }
    return;
  }
  b.round += 1; renderBattleArena(); setTimeout(() => { if (activeBattle) activeBattle.spitBurst = false; }, 240);
}

function toggleSeqPad(r, c) { const v9 = ensureV9State(); v9.seqGrid[r][c] = v9.seqGrid[r][c] ? 0 : 1; saveState(); renderStudioTab(); }
function calcGrooveMult() { const g = ensureV9State().seqGrid, n = g.flat().reduce((a,b)=>a+b,0); return Number(((n>=8&&n<=24?1.25:1.05)*(g[1][2]&&g[1][6]?1.15:1)).toFixed(2)); }
function toggleSeqPreview() {
  if (seqPreviewTimer) { clearInterval(seqPreviewTimer); seqPreviewTimer = null; renderStudioTab(); return; }
  AudioEngine.stop(); try { if (!AudioEngine.ctx) AudioEngine.ctx = new (window.AudioContext||window.webkitAudioContext)(); if (AudioEngine.ctx.state==='suspended') AudioEngine.ctx.resume(); } catch(e){return;}
  const v9 = ensureV9State(); seqPlayStep = 0;
  seqPreviewTimer = setInterval(() => {
    const col = seqPlayStep % 8, ctx = AudioEngine.ctx, now = ctx.currentTime;
    [[140,'sine',0.32],[250,'triangle',0.2],[4200,'square',0.04],[70,'sawtooth',0.14]].forEach(([hz,tp,gn], r) => {
      if (!v9.seqGrid[r][col]) return; const o = ctx.createOscillator(), g = ctx.createGain(); o.type = tp; o.frequency.setValueAtTime(hz, now);
      g.gain.setValueAtTime(gn, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.14); o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + 0.15);
    });
    document.querySelectorAll('.seq-pad').forEach(el => el.classList.toggle('playhead', Number(el.dataset.col) === col)); seqPlayStep++;
  }, Math.floor((60 / AudioEngine.getCurrentBpm()) * 500));
  renderStudioTab();
}

renderStudioTab = function () {
  const v9 = ensureV9State(), trd = rotateSnsTrendIfNeeded(), hotN = (MUSIC_ROOTS.find(r=>r.id===trd.hotRoot)?.name||'DRILL').split('//')[0].trim();
  const owned = state.music.ownedTracks.map(id => AudioEngine.findTrack(id)).filter(Boolean), rows = [['KICK','on-kick'],['SNARE','on-snare'],['HI-HAT','on-hat'],['808','on-bass']];
  setCockpitView(
    `<div class="stage-monitor" style="display:flex;align-items:center;padding:10px;background:radial-gradient(circle at 65% 30%,#2c134a,#07070c);"><div style="width:120px;height:184px;flex-shrink:0;">${renderBeatPuppetHTML(state.profile,{flameLevel:seqPreviewTimer?2:1,showMicHand:true})}</div><div style="flex:1;padding-left:8px;"><div style="font-size:10px;color:var(--accent-gold);font-weight:900;">🔥 今週SNSトレンド: ${hotN} ×2.0</div><div id="mv-line" style="font-size:11.5px;font-weight:900;color:#fff;background:rgba(0,0,0,0.55);padding:7px;border-radius:8px;margin-top:4px;">リリック(${state.lyrics.length}行) × 4×8ビート(x${calcGrooveMult()})で収録！</div></div></div>`,
    `<div class="trend-ticker-bar"><span>📈 VIRAL: ${hotN} (x2.0🔥)</span><span>GROOVE: x${calcGrooveMult()}</span></div>
    <div class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:10px;font-weight:900;color:var(--accent-cyan);">🎛️ 4×8 ビートシーケンサー</span><button class="btn ${seqPreviewTimer?'btn-danger':'btn-cyan'}" style="width:auto;padding:3px 8px;font-size:9px;" onclick="toggleSeqPreview()">${seqPreviewTimer?'⏹ 停止':'▶ 試聴'}</button></div>
    <div class="seq-matrix">${rows.map(([l,c],ri)=>`<div class="seq-row"><span class="seq-lbl">${l}</span>${v9.seqGrid[ri].map((v,ci)=>`<div class="seq-pad ${v?c:''}" data-col="${ci}" onclick="toggleSeqPad(${ri},${ci})"></div>`).join('')}</div>`).join('')}</div>
    <select id="studio-beat-sel" onchange="state.music.equippedTrackId=this.value;AudioEngine.playTrack(this.value);renderStudioTab()" style="margin-bottom:5px;">${owned.map(t=>`<option value="${t.id}" ${state.music.equippedTrackId===t.id?'selected':''}>♪ ${t.title} ${t.rootId===trd.hotRoot?'(🔥x2.0)':''}</option>`).join('')}</select>
    <select id="studio-feat-sel" style="margin-bottom:5px;">${FEAT_GUESTS.filter(f=>!f.reqRoster||(state.labelRoster&&state.labelRoster.length>0)).map(f=>`<option value="${f.id}">${f.name} ${f.cost?`(¥${f.cost.toLocaleString()})`:''}</option>`).join('')}</select>
    <input type="text" id="track-title" placeholder="新曲タイトル" style="margin-bottom:6px;"><button class="btn btn-lime" onclick="recordAndReleaseTrackV9()">🎙️ REC & VIRAL DROP</button></div>
    ${state.tracks.slice().reverse().map(t=>`<div class="shop-item"><div class="shop-info"><h4>🎵 ${escapeHtml(t.title)}</h4><p>${t.genre} / ▶ ${t.streams.toLocaleString()}再生</p></div><button class="btn btn-cyan" style="width:auto;padding:6px 11px;" onclick="playTrackMV('${t.id}')">▶ MV</button></div>`).join('')}`
  );
};

function recordAndReleaseTrackV9() {
  if (seqPreviewTimer) { clearInterval(seqPreviewTimer); seqPreviewTimer = null; }
  if (!state.lyrics.length) return showToast('先にリリックを1行以上書いてください！');
  const title = (document.getElementById('track-title')?.value||'').trim() || `ARCHIVE #${state.tracks.length+1}`;
  if (LEGAL_NG_WORDS.some(w => title.includes(w))) return showToast('⚠️ NGワードが含まれています');
  const feat = FEAT_GUESTS.find(f => f.id === document.getElementById('studio-feat-sel')?.value) || FEAT_GUESTS[0];
  if (state.cash < feat.cost) return showToast('客演ギャラ資金が足りません！'); state.cash -= feat.cost;
  const beat = AudioEngine.findTrack(document.getElementById('studio-beat-sel')?.value || state.music.equippedTrackId), trd = rotateSnsTrendIfNeeded();
  const tMult = beat.rootId === trd.hotRoot ? 2.0 : beat.rootId === trd.subRoot ? 1.4 : 1.0;
  const streams = Math.floor((2800 + state.lyrics.length*1250 + (state.stats.lyric+state.stats.flow+state.stats.vibes)*90 + getDripValue()/280) * tMult * calcGrooveMult() * feat.mult * getActiveLabelBuff('music'));
  const tr = { id:'trk_'+Date.now(), title: feat.id!=='none'?`${title} (${feat.name.split('（')[0]})`:title, beatId:beat.id, genre:beat.rootName, lines:state.lyrics.slice(-6).map(l=>l.text), streams };
  state.tracks.push(tr); state.respect += Math.round(40 * tMult); gainExp(70);
  triggerSlashCutIn(tMult>=2?'TREND VIRAL x2.0!!':'NEW DROP!!', `${streams.toLocaleString()} STREAMS`, '#ff2e93'); updateHeader(); saveState(); renderStudioTab(); playTrackMV(tr.id);
}

function cycleRosterZone(mcId) { const m = (state.labelRoster||[]).find(x=>x.id===mcId); if(!m)return; const o=['LOCAL','METRO','PORT']; m.zoneId=o[(o.indexOf(m.zoneId||'LOCAL')+1)%3]; saveState(); renderChartTab(); }
function runApparelLotDrop() {
  const v9 = ensureV9State(); if (!state.customOutfits?.length) return showToast('先に自社ブランド服を1着企画してください！');
  const lot = Number(document.getElementById('af-lot-slider')?.value || 80); v9.lotCount = lot;
  const scMult = lot <= 50 ? 2.45 : lot <= 120 ? 1.65 : 1.15, sold = Math.min(lot, 45 + Math.floor(state.respect*0.9 + state.stats.vibes*2.4)), rev = sold * Math.floor(14000 * scMult);
  state.cash += rev; state.respect += sold>=lot?30:16; gainExp(42); advanceWorldTime();
  triggerSlashCutIn(sold>=lot?'INSTANT SOLD OUT!!':'DROP SALES!!', `${sold}/${lot}着 +¥${rev.toLocaleString()}`, '#c8ff29'); renderChartTab();
}

const _v8Chart = renderChartTab;
renderChartTab = function () {
  const v9 = ensureV9State(); _v8Chart();
  const stg = document.querySelector('#stage-view .stage-monitor');
  if (stg) { stg.style.height = '238px'; stg.insertAdjacentHTML('beforeend', `<div class="turf-map-row">${['LOCAL','METRO','PORT'].map(z=>{const a=v9.turf[z]??50;return `<div class="turf-node"><div style="font-size:8.5px;color:#00f0ff;font-weight:900;">${z}</div><div style="font-size:9px;color:#fff;">A:${a}% / B:${100-a}%</div></div>`;}).join('')}</div>`); }
  const deck = document.getElementById('command-deck'); if (!deck || chartSubTab !== 'grow') return;
  if (state.growClass === 'label_owner' && state.labelRoster?.length) deck.insertAdjacentHTML('beforeend', `<div class="panel"><div class="sec-title" style="margin-top:0;"><span>🗺️ 所属MC エリア派遣＆縄張り</span></div>${state.labelRoster.map(m=>`<div class="shop-item"><div class="shop-info"><h4>🎤 ${escapeHtml(m.name)}</h4><p>支配率+2%/T</p></div><button class="btn btn-cyan" style="width:auto;padding:5px 9px;" onclick="cycleRosterZone('${m.id}')">📍 ${m.zoneId||'LOCAL'}</button></div>`).join('')}</div>`);
  if (state.growClass === 'apparel_founder') deck.insertAdjacentHTML('beforeend', `<div class="panel"><div class="sec-title" style="margin-top:0;"><span>🔥 生産ロット数＆プレ値シム</span></div><div style="font-size:10px;display:flex;justify-content:space-between;"><span>ロット: <b id="lot-lbl">${v9.lotCount||80}着</b></span><span style="color:var(--accent-lime);">少量プレ値運用</span></div><input type="range" id="af-lot-slider" class="lot-slider" min="20" max="240" step="10" value="${v9.lotCount||80}" oninput="document.getElementById('lot-lbl').textContent=this.value+'着'"><button class="btn btn-gold" onclick="runApparelLotDrop()">🚀 抽選DROP実行</button></div>`);
};
