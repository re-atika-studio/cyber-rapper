AudioEngine.getCurrentBpm = function () {
  const tid = this.currentTrackId || (state.music && state.music.equippedTrackId) || 'bb_01';
  return Math.max(75, Math.min(168, (this.findTrack(tid)?.bpm) || 96));
};
const Street25DEngine = {
  renderer: null, scene: null, camera: null, rafId: null, running: false, builtZoneIdx: -1,

  buildZoneScene(zIdx) {
    if (typeof THREE === 'undefined') return false;
    if (!this.renderer) { this.renderer = new THREE.WebGLRenderer({ antialias: true }); this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); this.camera = new THREE.PerspectiveCamera(58, 1.4, 0.2, 110); }
    const zone = STREET_ZONES[zIdx] || STREET_ZONES[0], sc = new THREE.Scene();
    sc.background = new THREE.Color(zone.sky || '#080914'); sc.fog = new THREE.FogExp2(zone.sky || '#080914', 0.024);

    for (let z = -30; z <= 30; z += 6) [-10.5, 10.5].forEach((xs, idx) => {

      const b = new THREE.Mesh(new THREE.BoxGeometry(3.6, h, 5.2), new THREE.MeshStandardMaterial({ color: 0x0c0e1c, roughness: 0.65 })); b.position.set(xs, h / 2, z); sc.add(b);

    });
    const rArr = new Float32Array(200 * 3); for (let i = 0; i < 200; i++) { rArr[i*3] = (Math.random()-0.5)*22; rArr[i*3+1] = Math.random()*14; rArr[i*3+2] = (Math.random()-0.5)*64; }

    this.scene = sc; this.builtZoneIdx = zIdx; return true;
